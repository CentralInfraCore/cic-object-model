---
id: validation/007_origin_duplicate_term
title: Canonical object with origin [yaml, yaml] is rejected
invariants: [INV-013, INV-039]
description: >-
  The origin grammar of SPEC 5.2 has four productions and [yaml, yaml] is not
  among them. It has no truth-table row either: the table in 5.3 enumerates
  which authorities HOLD, so it cannot express how many times a term appears.
  A validator built from presence questions — is yaml here, is schema here —
  therefore accepts this, because no exclusion rule is broken and every term is
  individually legal. INV-013 says "exactly this grammar. No other form is
  valid", and that is a statement about the sequence, not about its members.
