---
id: validation/010_primitive_member_is_not_a_node
title: A primitive member that is not a CIC node is rejected
invariants: [INV-003, INV-039]
description: >-
  INV-003 says every primitive member is itself a CIC node. One validator recursed when the member was a mapping and accepted it otherwise, so this object — whose `shape` is the number 7 — was reported `valid` by one implementation and rejected by the other. An `if let` with no `else` is how a check becomes a check of the cases that happen to reach it.
