---
version: '3.8'

# The Rust toolchain is pinned by digest, not by tag. `rust:1.96.1-bookworm` is
# a moving target; the digest is not, so the toolchain that passed here is the
# one CI runs.
#
# mk/rust.mk derives RUST_IMAGE_DIGEST from this anchor by grep, so the two
# cannot drift. It also means deleting this line does not fail loudly —
# `$(shell grep ...)` against a file without the anchor yields an empty string,
# not an error. `make rust.toolchain-pin` exists to make that failure loud.
x-rust-version: &rust_image rust:1.96.1-bookworm@sha256:d99f7b31f49909348dc59b51f3c95d1efded1701ffb222f095aaab7de3c4abd8

services:
  # Service for initializing and updating the Python virtual environment cache
  setup:
    build:
      context: .
      dockerfile: Dockerfile
    # Run as the current host user to avoid file permission issues
    # on mounted volumes.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      # Mount the project root to access requirements files
      - ./:/app
      # Mount the venv directory to be populated
      - ./p_venv:/app/p_venv:rw
    # Command to run to setup the environment
    command:
      - sh
      - -c
      - >-
        pip-compile --cache-dir /app/.pip-cache -o requirements.txt
        requirements.in && pip install --no-cache-dir -r requirements.txt
        --target /app/p_venv

  # Main service for running build, validation, and release tasks
  builder:
    build:
      context: .
      dockerfile: Dockerfile
    # Run as the current host user to avoid file permission issues
    # on mounted volumes.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      # Mount the populated venv directory as a read-only cache
      - ./p_venv:/app/p_venv:ro
      # Mount the project root to access spec/ + conformance/ and write to source
      - ./:/app:rw
      # Mount the host's Vault token file for scripts to use
      - "${XDG_RUNTIME_DIR}/vault/sign-token:/var/run/secrets/vault-token:ro"
      # Mount the host's Vault server CA certificate for TLS verification
      - "${XDG_RUNTIME_DIR}/vault/server.crt:/var/run/secrets/vault-ca.crt:ro"
    # Allows the container to reach the host machine (for Vault)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Pass through environment variables for the release process
    environment:
      - PYTHONPATH=/app:/app/p_venv   # Add /app to PYTHONPATH
      - VAULT_ADDR=https://host.docker.internal:18200
      - CIC_VAULT_TOKEN_FILE=/var/run/secrets/vault-token
      - CIC_VAULT_CA_FILE=/var/run/secrets/vault-ca.crt
      # HOME for the non-root user — the Go caches (GOCACHE/GOPATH) need a
      # writable home directory; the host UID has no /etc/passwd entry.
      - HOME=/tmp/home
      - GOCACHE=/tmp/home/.cache/go-build
      - GOPATH=/tmp/home/go
    # Keep the container running in the background
    command: ["tail", "-f", "/dev/null"]

  # Rust toolchain, deliberately separate from `builder`.
  #
  # The Dockerfile says Rust is intentionally not installed there, and that
  # holds: the Go and Rust implementations are independent implementations of
  # the same specification, not two halves of one binary. Keeping the
  # toolchains in separate containers makes it awkward to accidentally couple
  # them, which is the property the whole two-implementation design rests on.
  rust-builder:
    build:
      context: .
      dockerfile: Dockerfile.rust
      args:
        # The digest pin, passed through from the anchor above. Dockerfile.rust
        # cannot name a toolchain this file does not pin.
        RUST_IMAGE: *rust_image
    container_name: cic-object-model-rust-builder
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/git-source:rw
      # Host paths, created by `make rust.up` before the container starts.
      #
      # CIC-Relay binds ~/tmp/cache, which here is root-owned from an earlier
      # container run. Named volumes do not fix it: Docker creates them
      # root-owned too, and this service runs as the host user so it cannot
      # write them. Docker also creates a MISSING bind source as root, so the
      # directories have to exist before `up` — which is why rust.up mkdirs
      # them rather than relying on the daemon.
      #
      # No default value on purpose. A fallback path would be created by Docker
      # on first use — as root, because the daemon creates missing bind sources
      # — and cargo, running as the host user, then cannot write it. With a
      # `:?` the container refuses to start instead, naming the reason. Always
      # go through `make rust.up`.
      - ${RUST_CACHE_DIR:?set by mk/rust.mk; start this service with make rust.up}/cargo:/cargo
      - ${RUST_CACHE_DIR:?set by mk/rust.mk; start this service with make rust.up}/target:/target
    environment:
      - CARGO_HOME=/cargo
      - CARGO_TARGET_DIR=/target
      - CARGO_TERM_COLOR=never
      # RUSTUP_HOME is deliberately NOT overridden. The image installs its
      # toolchain under /usr/local/rustup; pointing rustup at the (empty) cargo
      # volume hides it, and every command fails with "could not choose a
      # version of rustc to run". The image already ships rustfmt and clippy,
      # which is why RUST_EXEC's `rustup component add` is tolerant of failure:
      # /usr/local/rustup is root-owned and this service runs as the host user.
    working_dir: /git-source
    stdin_open: true
    tty: true
    entrypoint: ["sh"]
    command: ["-c", "tail -f /dev/null"]
