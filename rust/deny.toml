# cargo-deny policy.
#
# Without this file cargo-deny applies a default that rejects every dependency,
# which reads as a working gate and is not one: it says nothing about the
# dependencies because it says the same thing about all of them.
#
# The list below is an allowlist, not a denylist. A licence nobody has looked at
# fails, which is the direction that catches a new transitive dependency
# arriving under terms this project cannot accept.

[advisories]
# Fail on any advisory affecting a crate in the tree. `unmaintained` is included
# deliberately: an unmaintained YAML parser is a real risk for a library whose
# input is untrusted by design.
yanked = "deny"
unmaintained = "workspace"

[licenses]
# Permissive licences only. This crate itself ships under CC-BY-NC-SA-4.0 and is
# not distributed through crates.io, so its own terms are not in scope here —
# what this checks is what it links against.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
# The workspace crate is not published and carries the repository's
# non-commercial licence; it is exempted from the allowlist above rather than
# the allowlist being widened to accept it for everything else too.
[[licenses.exceptions]]
name = "cic-object-model"
allow = ["CC-BY-NC-SA-4.0"]

[bans]
# Two versions of the same crate in one tree is usually accidental, and in a
# reference implementation it is also a second thing a reader has to reconcile.
multiple-versions = "deny"
wildcards = "deny"

[sources]
# Every dependency comes from the public registry. A git or path dependency
# would make this crate unreproducible for anyone who is not this repository.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
